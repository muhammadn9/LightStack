name: Claude Code Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

jobs:
  claude:
    # Trigger on:
    #   - Issue comment containing /claude
    #   - `claude` label being added to an issue
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/claude')) ||
      (github.event_name == 'issues' && github.event.label.name == 'claude')
    runs-on: macos-15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Claude Code agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude reads the issue body + comments for full context.
          # It will create a branch, implement the fix, verify the build,
          # and open a PR — all per the CLAUDE.md rules in the repo.
          allowed_tools: "Bash,Read,Write,Edit"
          custom_instructions: |
            You are working on the LightStack iOS app (SwiftUI, Xcode 16, iOS 17+).

            CRITICAL RULES (from CLAUDE.md):
            - After every code change, run the build command and verify EXIT=0 before committing:
              DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild build \
                -project Lightstack.xcodeproj -scheme Lightstack \
                -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2' \
                -quiet 2>&1 | tail -5; echo EXIT=$?
            - Never hand-edit Lightstack.xcodeproj/project.pbxproj.
              After adding/removing files run: xcodegen generate
            - Swift only. SwiftUI views only (no UIKit view controllers).
            - No force-unwraps. Use guard/if-let.
            - Use os.Logger instead of print.
            - Follow existing AppTheme for all colors, fonts, spacing.
            - No new third-party dependencies.

            WORKFLOW:
            1. Read the issue body carefully.
            2. Read the relevant source files before making changes.
            3. Implement the fix/feature.
            4. Build — fix all errors before committing.
            5. Commit with a clear message.
            6. The action will open a PR automatically.
