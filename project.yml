name: Lightstack
options:
  bundleIdPrefix: com.muhammadn9
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 9.0.0

targets:
  Lightstack:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Lightstack
        excludes:
          - "Resources/ExerciseGuides/**"
      - path: Lightstack/Resources/ExerciseGuides
        type: folder
        buildPhase: resources
    resources:
      - path: Lightstack/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Lightstack/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammadn9.lightstack
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 52
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only. The UI is portrait-locked, and App Store validation
        # rejects iPad-capable builds that don't support all four orientations.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7X8799T6N2
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Owholemodule
      # CODE_SIGN_IDENTITY is deliberately unset: with CODE_SIGN_STYLE=Automatic
      # Xcode picks Apple Development for builds and Apple Distribution when
      # archiving. Pinning it manually makes archiving fail with a conflicting
      # provisioning settings error.
    configFiles:
      Debug: Lightstack/Config/Secrets.xcconfig
      Release: Lightstack/Config/Secrets.xcconfig
    dependencies:
      - target: LightstackWidgets
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn

  # Lock screen / Dynamic Island Live Activity for the active workout. Its bundle id must
  # be prefixed by the app's, and its version numbers must equal the app's.
  LightstackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LightstackWidgets
      - path: Shared
    info:
      path: LightstackWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lightstack
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammadn9.lightstack.widgets
        # Same line format as the app's: scripts/testflight-release.sh bumps both with one sed.
        CURRENT_PROJECT_VERSION: 52
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7X8799T6N2
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  LightstackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LightstackTests
    dependencies:
      - target: Lightstack
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lightstack.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lightstack"
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammadn9.lightstack.tests

  LightstackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LightstackUITests
    dependencies:
      - target: Lightstack
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lightstack
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammadn9.lightstack.uitests

schemes:
  Lightstack:
    build:
      targets:
        Lightstack: all
        LightstackTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Lightstack
      targets:
        - LightstackTests

  LightstackUITests:
    build:
      targets:
        Lightstack: all
        LightstackUITests: [test]
    test:
      targets:
        - LightstackUITests
