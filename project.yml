name: Lightstack
options:
  bundleIdPrefix: org.lightstack
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Lightstack:
    type: application
    platform: iOS
    sources:
      - path: Lightstack
    resources:
      - path: Lightstack/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Lightstack/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.lightstack.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Owholemodule
    configFiles:
      Debug: Lightstack/Config/Secrets.xcconfig
      Release: Lightstack/Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Lightstack/Lightstack.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
